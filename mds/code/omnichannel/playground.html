<script type="text/javascript">
	
	//Load the default jquery buttons
	$(document).ready(function() {
	    startupButtons();
	    
	    $( "#button-startchannel" ).button({
			icon: "ui-icon-mail-send",
			showLabel: true
		}).click(function(){
			
			//Start Channel Request..
			
			
			
		});
	});
	
	function wipedb(){
		wipeDB(function(){
			MDS.log("DB WIPED!");
			//Do stuff.. from now..	
			createDB(function(){
				MDS.log("DB CREATED!");
				
				showChannels();
				
			});
		});
	}
	
	function logAllData(){
		//Get the DB
		sqlSelectAllChannels(function(allchannels){
			logJSON(allchannels,"CHANNEL DB");	
		});		
	}  
	
	//Been asked to start a channel.. if accept..
	function replyStartYES(){
		
		//CHECK DETAILS
		//..
		
		//Reset
		MESSAGE_SENT_USER1 = {};
		MESSAGE_SENT_USER1.type 		= "START_CHANNEL_ACCEPT";
		MESSAGE_SENT_USER1.hashid 		= MESSAGE_SENT_USER2.hashid;
		
		//Now create the funding txn..
		createFundingAddress(HASHID, PUBKEY_USER1, PUBKEY_USER2, function(fundingaddress){
			logJSON(fundingaddress);
			
			//And create the ELTOO address
			createELTOOAddress(HASHID, PUBKEY_USER1, PUBKEY_USER2, 20, function(eltooaddress){
				logJSON(eltooaddress);
				
				//Now create a FUNDING TXN.. add only your amount..
				createFundingTxn(fundingaddress.address, 10, 20, function(fundingtxn){
					logJSON(fundingtxn);
					
					//Now create the trigger..
					createTriggerTxn(20, fundingaddress.address, eltooaddress.address, function(triggertxn){
						logJSON(triggertxn);
						
						//And create the settlement..
						createSettlementTxn(0, eltooaddress.address, 20, 10, ADDRESS_USER1, 10, ADDRESS_USER2, function(settletxn){
							logJSON(settletxn);
							
							//SIGN settle and trigger (NOT FUNDING..)
							signTxn(settletxn.response.data, PUBKEY_USER2, function(signsettle){
								logJSON(signsettle);
								
								//And SIGN the trigger
								signTxn(triggertxn.response.data, PUBKEY_USER2, function(signtrigger){
									logJSON(signsettle);
									
									//OK - NOW we have the pieces tyo send back,, SIGN funding AFTER recieved valid signed txns
									//..
									
									
									
								});
							});			
						});	
					});
				});	
			});
		});
	}
	
	function showChannels(){
		sqlSelectAllChannels(function(allchannels){
			
			var output = "";
			
			var length = allchannels.rows.length;
			for(var i=0;i<length;i++){
				
				var channel = allchannels.rows[i];
				
				var row = i+") "+channel.HASHID+" "+channel.STATE;
				
				if(channel.STATE == "SENT_START_CHANNEL"){
					//Add buttons..
					row += "&nbsp;&nbsp;&nbsp; <button onclick='cancelRequest(\""+channel.HASHID+"\", \""+channel.USER2MAXIMAID+"\");'>CANCEL</button>"
										
				}else if(channel.STATE == "REQUEST_START_CHANNEL"){
					//Add buttons..
					row += "&nbsp;&nbsp;&nbsp; <button onclick='deny(\""+channel.HASHID+"\", \""+channel.USER1MAXIMAID+"\");'>DENY</button> <button onclick='accept(\""+channel.HASHID+"\", \""+channel.USER1MAXIMAID+"\");'>ACCEPT</button>"				
				
				}
				
				output += row+"<br><br>"
			}
				
			channelview.innerHTML = output;
		});		
	}
	
	function deny(hashid, maximaid){
		denyStartChannel(maximaid, hashid, function(delivered){
			showChannels();
		});
	}
	
	function accept(hashid, maximaid){
		acceptStartChannel(maximaid, hashid, function(delivered){
			showChannels();
		});
	}
	
	function cancelRequest(hashid, maximaid){
		cancelNewChannel(hashid, maximaid, function(ackdelivered){
			showChannels();
		});
	}
	
	//TESTER
	function printHello(params){MDS.log("PRINT HELLO "+JSON.stringify(params));}
	function sendack(){ackFunctionCall(MAXIMA_USER2, printHello, {"hello":"you"} );}
	
	var MAXIMA_USER1 = "0x30819F300D06092A864886F70D010101050003818D0030818902818100826686DA551C7AF8D0EF133D87E47D00630ED181D2CD2C3C3CB668C8CD2E24E3B06493F54009367C710470F05552DAD0643D136D832E8DAD29744718231B66E15C1AF87E0E6BC66484FAFFA14235A815ECF06C20D14D40292412128F670448FC2C86A7DA93BDE67FE309829A3E75484EFF730B941C8F22091BA85F24241907330203010001";
	var MAXIMA_USER2 = "0x30819F300D06092A864886F70D010101050003818D00308189028181008494D460B183563CCE456CAE7A241D234AE7C000126F47EF07F2D9BA0B4964DEA3F4ED3EEFC197100AB7C1D4BEB64A923EB3E2FD0423B9FD8C4B5CA62B35DFCA72F277B550AE15A809BEE1829070A72B203C54A58F07B785A7BFF9AE6AE600E36EF71F2DA174054BE4A3DE79C1397D894428CD47119DB541BEC38CFA0A4428F90203010001";
	
	function requestChannel(){
		requestNewChannel(MAXIMA_USER2, 10, 11,  function(delivered){
			if(!delivered){
				//Could not contact user.. show an immediate message
				alert("Could not contact User..");
			}
			
			showChannels();	
		});
	}
	
	//Main message handler..
	MDS.init(function(msg){
		
		//Do initialisation
		if(msg.event == "inited"){
			
			var wipedb= false;
			if(wipedb){
				wipeDB(function(){
					MDS.log("DB WIPED!");
					//Do stuff.. from now..	
					createDB(function(){});
				});
			}else{
				//Do stuff.. from now..	
				createDB(function(){
					
					//DB created..
					initAuthDetails(function(){
						
						showChannels();
							
					});
				});		
			}
			
		}else if(msg.event == "MAXIMA"){
				
			//Is it for maxsolo..
			if(msg.data.application == "thunderpay"){
				
				//Relevant data
				var pubkey 	= msg.data.from;
				
				//Get the data
				var datahex	= msg.data.data;
				
				//Convert back to JSON
				convertHEXtoJSON(datahex,function(maxmsg){
					if(MAXIMA_LOGS){
						logJSON(maxmsg,"MAXIMA RECEIVED FROM "+pubkey+" : ");
					}
					
					//What type of Message is it..?
					if(maxmsg.type == "ACK_MESSAGE"){
						
						//Send a SYN_ACKMESSAGE -  to show we received the ACK message
						sendMaximaMessage(pubkey, synackMessage(maxmsg));
						
					}else if(maxmsg.type == "SYNACK_MESSAGE"){
						
						//OK! - we can proceed.. call the function this message represents 
						synackMessageReceived(maxmsg);	
					
					}else if(maxmsg.type == "REQUEST_NEW_CHANNEL"){
						
						//Add to the database..
						sqlInsertNewChannel(maxmsg, "REQUEST_START_CHANNEL", function(){
							showChannels();
						});
											
					}else if(maxmsg.type == "CANCEL_NEW_CHANNEL"){
											
						//Check state and user
						checkValidMaximaUserState(pubkey,maxmsg.hashid, "REQUEST_START_CHANNEL", function(valid){
							if(valid){
								//CANCEL this request
								updateChannelState(maxmsg.hashid, "REQUEST_CANCELLED", function(upd){
									showChannels();
								});			
							}
						});
									
					}else if(maxmsg.type == "REQUEST_DENIED"){
						
						//Check state and user
						checkValidMaximaUserState(pubkey,maxmsg.hashid, "SENT_START_CHANNEL", function(valid){
							if(valid){
								//DENIED this request
								updateChannelState(maxmsg.hashid, "REQUEST_DENIED", function(upd){
									showChannels();
								});			
							}
						});
									
					}else if(maxmsg.type == "REQUEST_ACCEPTED"){
										
						//Lets go..
					
						
						
					}
				});
			}
		}
	});

</script>
