										<tr><td style="font-size: 4px;">&nbsp;</td></tr>
										
										<tr>
											<td class="alignright">
												Address : &nbsp;
											</td>
											<td>
												<input id="id_wallet_send_address"  type="text" style="width:100%">
											</td>			
										</tr>
										<tr><td style="font-size: 12px;">&nbsp;</td></tr>
										
										<tr>
											<td colspan=2 style="text-align:center;">
												<button onclick="sphincs_sendfunds();" class=mybtn>&nbsp;&nbsp;Send Funds&nbsp;&nbsp;</button> 
											</td>			
										</tr>
										
									</table>
									
									
								</div>
							</div>
							
						</td>
					</tr></table>
					
				</div>
				
				<!-- RECEIVE -->		
				<div class="fullwidthheight" style="display:none;" id="id_view_receive">
					
					<table class="fullwidthheight"><tr>
						<td style="padding-top:10px;padding-bottom:10px;">
							
							<div class="bluerounded">
								<div class="paddedborder">
									<br>
									<center>
										
									<div id="wallet_receiveqr"></div>
									<br>
									
									<div id="id_wallet_address" style="font-size:0.9em;white-space: wrap;width:350px;overflow-wrap: break-word;"></div>
									
									</center>
									
								</div>
							</div>
							
						</td>
					</tr></table>
					
				</div>
				
				<!-- HELP -->		
				<div class="fullwidthheight" style="display:none;" id="id_view_help">
					
					<table class="fullwidthheight"><tr>
						<td style="padding-top:10px;padding-bottom:10px;">
							
							<div class="bluerounded">
								<div class="paddedborder">
									<p style="width:100%;">
									<b>Help</b><br>
									<br>
									This is a SPHINCS+ wallet<br>
									<br>
									This is different from yourt normal Minima wallet as it does not need to keep track of KEY_USES.. (very cool)<br>
									<br>
									The logic is performed in a KISSVM script as a special smart contract<br>
									<br>
									</p>
								</div>
							</div>
							
						</td>
					</tr></table>
					
				</div>
				
			</td>
		</tr>
		
		<!-- Navigation buttons -->
		<tr>
			<td style="padding-bottom:10px;">
				<div class="bluerounded">
					<div class="paddedborder">
						
						<table width=100%>
							<tr>
								<td style="text-align:center;">
									
									<button style="min-width:100;" class=mybtn onclick="navigate_balance();">BALANCE</button>&nbsp;&nbsp;
									<button style="min-width:100;" class=mybtn onclick="navigate_send();">SEND</button>&nbsp;&nbsp;
									<button style="min-width:100;" class=mybtn onclick="navigate_receive();">RECEIVE</button>&nbsp;&nbsp;
									<button style="min-width:100;" class=mybtn onclick="navigate_help();">HELP</button>			
									
								</td>
							</tr>
						</table>
						
						
					</div>
				</div>
				
			</td>
		</tr>
		
	</table>
